name: Build Bloodborne Port Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar tu codigo hibrido
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Activar compiladores C++ de Windows
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
          Start-Process -FilePath ".\vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait
          $sdkPath = Get-ChildItem "C:\VulkanSDK" | Select-Object -First 1 -ExpandProperty FullName
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar y empaquetar el proyecto
        shell: bash
        run: |
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          bash build.sh
          bash packaging/windows/package.sh

      - name: Subir emulador compilado para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-PC-Hibrido
          path: |
            dist/**
            build/**
            release/**
            out/**
            *.exe
            *.dll
            *.zip
